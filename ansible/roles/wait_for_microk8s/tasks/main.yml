---
- name: Wait for SSH connectivity
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Check microk8s command exists
  ansible.builtin.command: which microk8s
  changed_when: false

- name: Wait until MicroK8s API responds
  ansible.builtin.command: microk8s kubectl get --raw=/readyz
  register: microk8s_readyz
  retries: 60
  delay: 5
  until: microk8s_readyz.rc == 0 and ('ok' in (microk8s_readyz.stdout | lower))
  changed_when: false

- name: Wait until node is visible in cluster
  ansible.builtin.command: microk8s kubectl get nodes -o wide
  register: microk8s_nodes
  retries: 60
  delay: 5
  until: microk8s_nodes.rc == 0
  changed_when: false
